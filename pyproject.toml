[project]
name = "vasco"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "argparsedirs>=0.2.1",
    "astropy>=8.0.1",
    "colorama>=0.4.6",
    "demeteor>=0.2.2",   # Catalogue.names() and the bundled star catalogue
    "demetria>=0.1.0",
    "dotmap>=1.3.30",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pyqt6>=6.11.0",
    "ruamel-yaml>=0.19.1",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
