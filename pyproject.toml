[project]
name = "vasco"
version = "0.1.0"
# 3.14, as demeteor, demetria, vamos and the AMOS server all are
requires-python = ">=3.14"
# Very little now that the mathematics lives in the libraries: demeteor carries the matcher, the
# fitting driver and the sensor data, and demetria the correction fields those are built from. What
# is left here is a window, some plots and two entry points. scipy went with the optimiser it was
# for; demetria is no longer imported directly.
#
# PyQt6 is under [gui] below, and matplotlib with it: vasco-fit is a filter with no window and runs
# where neither is installed. `uv sync --extra gui` for the window.
dependencies = [
    "astropy>=8.0.1",
    "colorama>=0.4.6",
    "demeteor>=0.3.1",
    "dotmap>=1.3.30",
    "numpy>=2.5.2",
    "ruamel-yaml>=0.19.1",   # YAML 1.2, so that a zero-padded fno is not octal
]

[project.optional-dependencies]
gui = [
    "matplotlib>=3.11.1",
    "pyqt6>=6.11.0",
]

[project.scripts]
vasco-fit = "vasco.cli.fit:main"
vasco-gui = "vasco.cli.gui:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vasco"]
